rules:
  # `uses: $/` is the fix for the call to round.yml, but actionlint rejects it until
  # https://github.com/rhysd/actionlint/issues/711 lands. `./remain` is a checkout of cutenode/remain,
  # not this repository, so `$/` would point at the wrong thing there.
  self-repository:
    disable: true
  # e2e.yml's workflow path runs remain's reusable workflow as callers get it once it's on main.
  unpinned-uses:
    config:
      policies:
        cutenode/remain/*: ref-pin
